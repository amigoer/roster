name: CI

on:
  push:
    branches: [main]
  pull_request:

# a new push to the same branch makes the run before it pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # the platform Roster is developed and released on; Windows and Linux are untested
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # the version comes from packageManager in the root package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # --ignore-scripts keeps Electron's postinstall from pulling 100MB nothing here runs
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # first, and not last: the packages typecheck against adapter-api's declarations, and a
      # fresh checkout has no dist for them to come from
      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test
