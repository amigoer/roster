name: Release

# Publishing the release is the trigger, so the artifacts land on one that already
# exists. workflow_dispatch is for building again without touching the tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: the tag to build and attach the app to
        required: true

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  # the artifacts are uploaded to the release with the token below
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Electron's own download is worth keeping: it is most of the build's time
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # no --ignore-scripts here, unlike CI: electron-builder wants the Electron the postinstall fetches
      - run: pnpm install --frozen-lockfile

      # before the checks: they typecheck against adapter-api's declarations, which are built
      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test

      # builds every package, stages what the app carries, then dmg and zip for both architectures
      - run: pnpm package

      - name: Checksums
        working-directory: packages/desktop/release
        run: shasum -a 256 *.dmg *.zip > checksums.txt

      - name: Attach to the release
        working-directory: packages/desktop/release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" *.dmg *.zip checksums.txt --clobber
